name = "gaband-news-site"
main = "index.js"
compatibility_date = "2026-04-26"
workers_dev = false

routes = [
  { pattern = "news.gaband323.dev", custom_domain = true }
]

[observability]
enabled = true

[vars]
SITE_NAME = "Gaband323 News"
SITE_ORIGIN = "https://news.gaband323.dev"
NEWS_COUNTRY = "us"
NEWS_LANG = "en"
ADMIN_EMAILS = "gaband323@gmail.com"
ADMIN_PRESET_EMAIL = "gaband323@gmail.com"
EMAIL_FROM = "Gaband323 News <updates@news.gaband323.dev>"
DIGEST_SUBJECT = "Your Gaband News update"
FETCH_CATEGORIES = "general,business,technology,entertainment,health,government,science,sports"
TRENDING_QUERIES = "AI,Cloudflare,Roblox,Discord,Los Angeles,transportation"

[[d1_databases]]
binding = "DB"
database_name = "gaband-news-db"
database_id = "c5067299-9c0a-40b8-811e-f692b84eb221"

[triggers]
crons = ["*/30 * * * *", "0 14 * * *"]
